<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everyone Else - Zine Slideshow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f111a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .slideshow-container {
      position: relative;
      max-width: 960px;
      width: 100%;
      background: #1a1d2d;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .slide-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      background-color: #000;
    }

    .slide {
      display: none;
      width: 100%;
      text-align: center;
    }

    .slide.active {
      display: block;
    }

    .slide img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #141622;
      border-top: 1px solid #2a2d3d;
    }

    .btn {
      background-color: #e63946;
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background-color: #c5221f;
    }

    .btn:disabled {
      background-color: #3a3f58;
      color: #8a8f9d;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .page-indicator {
      font-size: 0.95rem;
      font-weight: 500;
      color: #a0aabb;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="slideshow-container">
    <div class="slide-wrapper">
      <!-- Complete 16-Page Zine Gallery -->
      <div class="slide active"><img src="page-01.jpg" alt="Page 1 - Cover"></div>
      <div class="slide"><img src="page-02.jpg" alt="Page 2 - Manifesto"></div>
      <div class="slide"><img src="page-03.jpg" alt="Page 3 - WTC Map"></div>
      <div class="slide"><img src="page-04.jpg" alt="Page 4 - WTC Profiles (1:00 PM)"></div>
      <div class="slide"><img src="page-05.jpg" alt="Page 5 - WTC Spatial Flows"></div>
      <div class="slide"><img src="page-06.jpg" alt="Page 6 - Restaurant Distribution Data"></div>
      <div class="slide"><img src="page-07.jpg" alt="Page 7 - Wall Street Map"></div>
      <div class="slide"><img src="page-08.jpg" alt="Page 8 - Wall Street Profiles (8:30 AM)"></div>
      <div class="slide"><img src="page-09.jpg" alt="Page 9 - Wall Street Spatial Flows"></div>
      <div class="slide"><img src="page-10.jpg" alt="Page 10 - Daily Ridership Profile"></div>
      <div class="slide"><img src="page-11.jpg" alt="Page 11 - Battery Park Map"></div>
      <div class="slide"><img src="page-12.jpg" alt="Page 12 - Battery Park Profiles (6:00 PM)"></div>
      <div class="slide"><img src="page-13.jpg" alt="Page 13 - Battery Park Spatial Flows"></div>
      <div class="slide"><img src="page-14.jpg" alt="Page 14 - Waste Collection Cycle"></div>
      <div class="slide"><img src="page-15.jpg" alt="Page 15 - Manifesto Conclusion"></div>
      <div class="slide"><img src="page-16.jpg" alt="Page 16 - Back Cover & Credits"></div>
    </div>

    <!-- Navigation Bar -->
    <div class="controls">
      <button class="btn" id="prevBtn" onclick="changeSlide(-1)">← Previous</button>
      <span class="page-indicator" id="pageIndicator">Page 1 of 16</span>
      <button class="btn" id="nextBtn" onclick="changeSlide(1)">Next →</button>
    </div>
  </div>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    const pageIndicator = document.getElementById('pageIndicator');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function updateSlideshow() {
      slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentSlide);
      });
      pageIndicator.textContent = `Page ${currentSlide + 1} of ${totalSlides}`;
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(direction) {
      currentSlide += direction;
      if (currentSlide < 0) currentSlide = 0;
      if (currentSlide >= totalSlides) currentSlide = totalSlides - 1;
      updateSlideshow();
    }

    // Keyboard Navigation Support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentSlide > 0) {
        changeSlide(-1);
      } else if (e.key === 'ArrowRight' && currentSlide < totalSlides - 1) {
        changeSlide(1);
      }
    });

    // Initialize State
    updateSlideshow();
  </script>

</body>
</html>
